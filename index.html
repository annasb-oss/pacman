<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Pac-Man — Arcade Clássico</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#050505;--line:#1717c8;--blue:#2121de;--cyan:#00e5ff;--gold:#ffff00;--muted:#d8d8d8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;padding:26px 14px}
main{width:min(100%,540px)}header{text-align:center;margin-bottom:12px}.kicker{display:none}h1{margin:7px 0 3px;font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:.13em;color:#ffff00;text-shadow:0 0 16px #ffff0055}header p{margin:0;color:#bdbdbd;font-size:.82rem} .panel{position:relative} .metric{transition:border-color .2s,transform .2s} .metric:hover{border-color:#b7eee2;transform:translateY(-1px)} .ranking li:first-child b{color:#ffe29a} canvas{image-rendering:auto} .dialog button.primary{box-shadow:0 3px 0 #b8b800} .dialog button.primary:hover{filter:brightness(1.12);transform:translateY(-1px)} .kicker{letter-spacing:.24em} .settings{color:#d6c9e4} .settings select{background:#111;color:#fff;border-color:#3535ff} .actions button{min-width:104px} button{transition:transform .16s ease,filter .16s ease} button:active{transform:translateY(1px) scale(.98)}
.shell{display:block}.panel{background:#050505;border:1px solid #2424d8;border-radius:12px;padding:12px;box-shadow:0 0 24px #1515a833}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.metric{background:#090909;border:1px solid #2525b8;border-radius:6px;padding:8px 10px}.metric small{display:block;font-size:.61rem;color:#b8b8b8;letter-spacing:.12em;text-transform:uppercase}.metric strong{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.board-wrap{position:relative;max-width:456px;margin:auto}canvas{display:block;width:100%;height:auto;aspect-ratio:19/21;background:#000;border:2px solid #2121de;border-radius:5px;box-shadow:0 0 20px #1717c855;touch-action:none}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}button,select{font:inherit;color:#eef4ff;background:#111;border:1px solid #3535ff;border-radius:5px;padding:10px 14px;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.18)}button:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}button.primary{background:#ffff00;border-color:#ffff00;color:#000}.settings{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;color:#bbb;font-size:.8rem}.settings select{padding:7px 10px;font-size:.8rem}
aside h2{font-size:.78rem;letter-spacing:.16em;color:#b7eee2;text-transform:uppercase;margin:2px 0 12px}.ranking{list-style:none;padding:0;margin:0}.ranking li{display:flex;justify-content:space-between;border-bottom:1px solid #23365e;padding:9px 2px;font-size:.84rem}.ranking li b{color:var(--gold)}.aside-copy{font-size:.81rem;line-height:1.6;color:#9eafd1}.legend{display:grid;gap:9px;margin:12px 0 20px;font-size:.78rem;color:#b6c5e3}.legend span{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:#f7eac1}.dot.power{width:12px;height:12px;background:#fff;border:2px solid var(--cyan)}.dot.ghost{background:#ff5e86;border-radius:4px;width:12px;height:12px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;margin-top:14px}.dpad button{padding:0;font-size:1.05rem;touch-action: none}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}
.hint{text-align:center;color:#8296c0;font-size:.72rem;margin:10px 0 0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000d;border-radius:5px;padding:18px;text-align:center}.overlay[hidden]{display:none}.dialog{width:min(100%,290px);background:#050505;border:2px solid #2121de;border-radius:8px;padding:24px 20px;box-shadow:0 0 28px #1717a866}.dialog h2{font-size:1.5rem;color:#ffff00;margin:0 0 8px;letter-spacing:.08em}.dialog p{font-size:.83rem;line-height:1.5;color:#ddd;margin:0 0 16px}.dialog button{width:100%}.dialog .sub{margin-top:8px;background:transparent}.dialog h2{font-size:1.65rem;letter-spacing:.1em}.dialog{backdrop-filter:blur(8px)}.foot{display:none}
@media(max-width:740px){.shell{grid-template-columns:1fr}.panel{padding:10px}.hud{gap:5px}.metric{padding:7px}.metric strong{font-size:1rem}.side{display:none}.aside-copy{font-size:.76rem}}
@media(max-width:390px){body{padding:18px 8px}.hud small{font-size:.54rem}.metric strong{font-size:.92rem}.side{display:none}}
</style>
</head>
<body><main>
<header><h1>PAC-MAN</h1><p>1 jogador · Use as setas ou WASD</p></header>
<div class="shell">
<section class="panel">
<div class="hud">
<div class="metric"><small>Pontuação</small><strong id="score">000000</strong></div>
<div class="metric"><small>Recorde</small><strong id="best">000000</strong></div>
<div class="metric"><small>Vidas</small><strong id="lives">3</strong></div>
<div class="metric"><small>Fase</small><strong id="level">1</strong></div>
</div>
<div class="board-wrap">
<canvas id="game" width="456" height="504" aria-label="Labirinto do Pac-Man"></canvas>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="overlayTitle">PAC-MAN</h2><p id="overlayText">Use as setas ou WASD para controlar o Pac-Man. A partida começa quando você escolher uma direção.</p><button class="primary" id="play">Começar partida</button><button class="sub" id="resume" hidden>Continuar</button></div></div>
</div>
<div class="actions"><button id="pause">Pausar</button><button id="restart">Reiniciar</button><button id="sound">Som: ligado</button></div>
<div class="settings"><span>Ritmo da partida</span><select id="difficulty"><option value="easy" selected>Tranquila</option><option value="normal">Clássica</option><option value="hard">Desafio</option></select></div>

</section>
</div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const TILE=24,COLS=19,ROWS=21;
const BASE=[
"###################",
"#........#........#",
"#.##.###.#.###.##.#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###.#.###.####",
"####.#.......#.####",
"####.#.......#.####",
"...................",
"####.#.#####.#.####",
"####.#.......#.####",
"####.#.#####.#.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#...........#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"###################"
].map(s=>s.replaceAll(' ','#'));
const DIR={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};
const OPP={left:'right',right:'left',up:'down',down:'up'};
const SPEED={easy:13,normal:11,hard:9};
let grid,player,ghosts,score=0,lives=3,level=1,state='menu',power=0,frame=0,sound=true,audio=null,stepCounter=0;
let best=Number(localStorage.getItem('neonPacmanBest')||0);
function cloneMap(){return BASE.map(row=>row.split(''))}
function resetActors(){
 player={x:9,y:16,prevX:9,prevY:16,dir:null,next:null,mouth:0};
 ghosts=[
  {x:9,y:9,prevX:9,prevY:9,dir:'left',color:'#ff0000',personality:'chaser'},
  {x:8,y:10,prevX:8,prevY:10,dir:'up',color:'#ffb8ff',personality:'ambusher'},
  {x:10,y:10,prevX:10,prevY:10,dir:'down',color:'#00ffff',personality:'flanker'},
  {x:9,y:11,prevX:9,prevY:11,dir:'left',color:'#ffb852',personality:'shy'}
 ];
}
function newBoard(){grid=cloneMap();resetActors();power=0;stepCounter=0}
function wall(x,y){return x<0||y<0||x>=COLS||y>=ROWS||grid[y][x]==='#'}
function hud(){
 $('score').textContent=String(score).padStart(6,'0');
 $('best').textContent=String(best).padStart(6,'0');
 $('lives').textContent=String(lives);$('level').textContent=String(level);
}
function showOverlay(title,message,button='Começar partida',resume=false){
 $('overlayTitle').textContent=title;$('overlayText').textContent=message;$('play').textContent=button;
 $('resume').hidden=!resume;$('overlay').hidden=false;
}
function hideOverlay(){$('overlay').hidden=true}
function tone(freq=440,duration=.05){
 if(!sound)return;
 try{audio??=new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.012,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}
}
function saveScore(){
 if(score>best){best=score;localStorage.setItem('neonPacmanBest',String(best))}
 hud();
}
function start(newGame=false){
 if(newGame||state==='menu'||state==='over'||state==='won'){score=0;lives=3;level=1;newBoard();hud()}
 state='playing';hideOverlay();
}
function finish(){
 state='over';saveScore();showOverlay('FIM DE JOGO','Sua pontuação foi '+score+'. Que tal tentar superar seu recorde?','Jogar novamente');
}
function tryMove(entity,dir){
 const d=DIR[dir];if(!d||wall(entity.x+d.x,entity.y+d.y))return false;
 entity.prevX=entity.x;entity.prevY=entity.y;entity.x+=d.x;entity.y+=d.y;return true;
}
function pathDistance(sx,sy,tx,ty){
 const queue=[[sx,sy,0]],seen=new Set([sx+','+sy]);
 for(let i=0;i<queue.length;i++){const [x,y,n]=queue[i];if(x===tx&&y===ty)return n;
  for(const d of Object.values(DIR)){const nx=x+d.x,ny=y+d.y,key=nx+','+ny;if(!wall(nx,ny)&&!seen.has(key)){seen.add(key);queue.push([nx,ny,n+1])}}
 }return 999;
}
function ghostTarget(g){
 const corners=[[1,1],[17,1],[1,19],[17,19]];
 if(power>0)return corners[g.personality==='shy'?0:g.personality==='ambusher'?1:g.personality==='flanker'?2:3];
 if(g.personality==='ambusher'){
  const d=DIR[player.dir||'left'];return {x:Math.max(1,Math.min(17,player.x+d.x*4)),y:Math.max(1,Math.min(19,player.y+d.y*4))};
 }
 if(g.personality==='flanker'){
  const d=DIR[player.dir||'left'];return {x:Math.max(1,Math.min(17,player.x+d.x*2+(player.x-g.x))),y:Math.max(1,Math.min(19,player.y+d.y*2+(player.y-g.y)))};
 }
 if(g.personality==='shy'&&pathDistance(g.x,g.y,player.x,player.y)<6)return corners[3];
 return {x:player.x,y:player.y};
}
function ghostMove(g){
 g.prevX=g.x;g.prevY=g.y;
 let options=Object.keys(DIR).filter(d=>!wall(g.x+DIR[d].x,g.y+DIR[d].y));
 if(options.length>1)options=options.filter(d=>d!==OPP[g.dir]);
 if(!options.length)return;
 const target=ghostTarget(g);
 if(power>0){
  options.sort((a,b)=>pathDistance(g.x+DIR[b].x,g.y+DIR[b].y,target.x,target.y)-pathDistance(g.x+DIR[a].x,g.y+DIR[a].y,target.x,target.y));
 }else{
  const difficulty=$('difficulty').value;
  if(Math.random()<(difficulty==='easy'?.16:.07))options.sort(()=>Math.random()-.5);
  else options.sort((a,b)=>pathDistance(g.x+DIR[a].x,g.y+DIR[a].y,target.x,target.y)-pathDistance(g.x+DIR[b].x,g.y+DIR[b].y,target.x,target.y));
 }
 g.dir=options[0];tryMove(g,g.dir);
}
function loseLife(){
 lives--;hud();tone(100,.28);
 if(lives<=0){finish();return}
 player.x=9;player.y=16;player.prevX=9;player.prevY=16;player.dir=null;player.next=null;
 ghosts[0].x=9;ghosts[0].y=9;ghosts[1].x=8;ghosts[1].y=10;ghosts[2].x=10;ghosts[2].y=10;ghosts[3].x=9;ghosts[3].y=11;ghosts.forEach(g=>{g.prevX=g.x;g.prevY=g.y});
 power=0;
}
function remaining(){return grid.some(row=>row.some(c=>c==='.'||c==='o'))}
function update(){
 if(state!=='playing')return;
 // A partida fica aguardando a primeira direção: jogador e fantasmas não andam sozinhos.
 if(!player.next&&!player.dir)return;
 frame++;stepCounter++;
 const pace=Math.max(8,SPEED[$('difficulty').value]-Math.floor((level-1)/3));
 if(stepCounter<pace)return;stepCounter=0;
 player.mouth=(player.mouth+1)%10;
 player.prevX=player.x;player.prevY=player.y;
 if(player.next&&tryMove(player,player.next))player.dir=player.next;
 else if(player.dir)tryMove(player,player.dir);
 const cell=grid[player.y][player.x];
 if(cell==='.'||cell==='o'){score+=cell==='o'?50:10;grid[player.y][player.x]=' ';if(cell==='o'){power=70;tone(880,.12)}else tone(500,.025);if(score>best){best=score;localStorage.setItem('neonPacmanBest',String(best))}hud()}
 for(let i=0;i<ghosts.length;i++){const g=ghosts[i];if(frame%(i===0?1:1)===0)ghostMove(g)}
 if(power>0)power--;
 for(const g of ghosts){if(g.x===player.x&&g.y===player.y){if(power>0){score+=200;g.x=9;g.y=9;g.prevX=9;g.prevY=9;tone(180,.1);hud()}else{loseLife();return}}}
 if(!remaining()){level++;newBoard();hud();tone(740,.2)}
}
function movementProgress(){const pace=Math.max(8,SPEED[$('difficulty').value]-Math.floor((level-1)/3));return Math.min(1,stepCounter/pace)}
function drawPacman(){
 const t=movementProgress(),x=(player.prevX+(player.x-player.prevX)*t)*TILE+12,y=(player.prevY+(player.y-player.prevY)*t)*TILE+12;
 const angle={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[player.dir]||0;
 const opening=player.mouth<5?player.mouth*.12:(9-player.mouth)*.12;
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=12;
 ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,10,opening,Math.PI*2-opening);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(3,-4,1.5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawGhost(g){
 const t=movementProgress(),x=(g.prevX+(g.x-g.prevX)*t)*TILE+12,y=(g.prevY+(g.y-g.prevY)*t)*TILE+12,body=power>0?(power<18&&Math.floor(frame/5)%2?'#f4f6ff':'#4267e8'):g.color;
 ctx.save();ctx.fillStyle=body;ctx.shadowColor=body;ctx.shadowBlur=power>0?10:5;
 ctx.beginPath();ctx.arc(x,y-1,9,Math.PI,0);ctx.lineTo(x+9,y+9);ctx.lineTo(x+4,y+6);ctx.lineTo(x,y+9);ctx.lineTo(x-4,y+6);ctx.lineTo(x-9,y+9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 if(power<=0){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x-3,y-2,2.7,3.5,0,0,Math.PI*2);ctx.ellipse(x+3,y-2,2.7,3.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172345';ctx.beginPath();ctx.arc(x-2,y-1,1.4,0,7);ctx.arc(x+4,y-1,1.4,0,7);ctx.fill()}
 ctx.restore();
}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const c=grid[y][x],px=x*TILE,py=y*TILE;
  if(c==='#'){ctx.fillStyle='#08085c';ctx.fillRect(px+1,py+1,TILE-2,TILE-2);ctx.strokeStyle='#2121de';ctx.lineWidth=1.6;ctx.strokeRect(px+2,py+2,TILE-4,TILE-4)}
  else if(c==='.'||c==='o'){ctx.beginPath();ctx.fillStyle=c==='o'?'#fff':'#fff';ctx.shadowColor=c==='o'?'#fff':'transparent';ctx.shadowBlur=c==='o'?8:0;ctx.arc(px+12,py+12,c==='o'?5:2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 }
 drawPacman();ghosts.forEach(drawGhost);
}
function loop(){update();draw();requestAnimationFrame(loop)}
function setDirection(d){if(DIR[d]&&state==='playing')player.next=d}
document.addEventListener('keydown',e=>{
 const key=e.key.toLowerCase(),d=({arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'})[key];
 if(d){e.preventDefault();setDirection(d)}
 if(key===' '){e.preventDefault();if(state==='playing'){state='paused';showOverlay('PAUSADO','A partida está pausada. Respire e prepare sua próxima jogada.','',true)}else if(state==='paused'){state='playing';hideOverlay()}}
 if(key==='enter'&&(state==='menu'||state==='over'||state==='won'))start();
});
document.querySelectorAll('[data-dir]').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(btn.dataset.dir)})});
$('play').addEventListener('click',()=>start(state==='over'||state==='won'));
$('resume').addEventListener('click',()=>{state='playing';hideOverlay()});
$('pause').addEventListener('click',()=>{if(state==='playing'){state='paused';showOverlay('PAUSADO','Sua partida está guardada.','',true)}else if(state==='paused'){state='playing';hideOverlay()}});
$('restart').addEventListener('click',()=>{state='menu';start(true)});
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent='Som: '+(sound?'ligado':'desligado');if(sound)tone(660)});
newBoard();hud();showOverlay('PAC-MAN','Use as setas ou WASD para controlar o Pac-Man. Os fantasmas começam a se mover junto com você!','Começar partida');loop();
})();
</script>
</body></html>
